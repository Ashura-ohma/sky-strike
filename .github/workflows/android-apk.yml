name: Build Android APK

on:
  push:
    branches: [main, offline-moba]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Prepare bundled art
        run: python3 scripts/prepare_assets.py
      - name: Run game logic tests
        run: node --test tests/*.test.js
      - uses: actions/cache@v4
        with:
          path: .signing/debug.keystore
          key: zhufeng-v4-debug-signing-v1
      - name: Prepare cached debug signing key
        run: |
          mkdir -p .signing
          if [ ! -f .signing/debug.keystore ]; then
            keytool -genkeypair -keystore .signing/debug.keystore -alias androiddebugkey -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
          fi
      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: zhufeng-moba-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
